[workspace]
resolver = "3"
members = [
    "sdk",
    "crates/emulator",
    "crates/admin-api",
    "crates/collector",
    "crates/common",
    "crates/json-writer",
    "crates/rate-streamer"
]

[workspace.package]
version = "0.1.17"
edition = "2024"

[workspace.dependencies]
redis = { version = "1.3.0", features = ["tokio-comp", "connection-manager", "streams", "tokio-rustls-comp"] }

tokio = { version = "1.52.3", features = ["full"] }
async-stream = "0.3.6"
futures-util = "0.3.32"
anyhow = { version = "1.0.103" }
clap = { version = "4.6.1", features = ["derive"] }
axum = { version = "0.8.9", features = ["ws"]}
axum-client-ip = { version = "1.3.1", features = ["serde", "forwarded-header"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
bytes = "1.12.0"
uuid = { version = "1.23.4", features = ["v4"] }
sha2 = "0.11.0"
ipnet = "2.12.0"
env_logger = "0.11.11"
log = "0.4.33"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12", "logging"] }
common = { path = "crates/common" }
rhiaqey-sdk-rs = { path = "sdk" }

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
opt-level = 3
debug = 0
strip = "symbols"
incremental = false

[profile.dev]
opt-level = 1
split-debuginfo = "packed"

[profile.bench]
inherits = "release"
debug = true
